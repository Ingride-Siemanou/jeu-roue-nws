<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Roue NWS</title>

    <link rel="stylesheet" href="jeu de roue.css">
</head>

<body>

<header class="header">
   <img src="logo nws.jpg" alt="Logo Normandie Web School" class="logo">
    <h1 class="header-title">LA ROUE NWS</h1>
    <div class="score">
        Score : <span id="score">0</span>
    </div>
</header>

<main class="game">
    <section class="intro">
        <p class="mini-title">NORMANDIE WEB SCHOOL</p>
        <h2>TOURNE LA <span>ROUE !</span></h2>
        <p>
            Clique sur le bouton et découvre ton défi.
        </p>
    </section>

    <section class="wheel-zone">
    <div class="wheel-wrapper">
    <div class="pointer"></div>
    <div class="wheel" id="wheel">
    <div class="wheel-text text1">Défi code</div>
    <div class="wheel-text text2">Defi créatif</div>
    <div class="wheel-text text3">Défi réseaux</div>
    <div class="wheel-text text4">Défi IA</div>
    <div class="wheel-text text5">Quiz NWS</div>
    <div class="wheel-text text6">Bonus</div>
    <div class="wheel-text text7">Risques</div>
    <div class="wheel-center">
        NWS
    </div>
</div>
    </div>
    </div>

        <div class="controls">
            <button id="spinButton">
                TOURNER LA ROUE
            </button>
            <div class="result" id="result">
                Prêt à jouer ?
            </div>
        </div>
    </section>
</main>
</body>
</html>
